server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: vehicles
              uri: lb://vehiclesMicroservice
              predicates:
                - Path=/veh/**
            - id: operations
              uri: lb://operationsMicroservice
              predicates:
                - Path=/operations/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka